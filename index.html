<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DM Teleport Map</title>
  <meta name="description" content="Clickable GTA V map of interiors and common locations for NoPixel Dungeon Masters. Click a pin to copy its teleport coordinates.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Location directory">
      <header class="brand">
        <img class="brand-mark" src="assets/icon.svg" alt="" width="36" height="36">
        <div>
          <h1>DM Teleport Map</h1>
          <p>GTA V interiors &amp; spots for NoPixel</p>
        </div>
        <button class="icon-btn drawer-close" id="drawerClose" type="button" aria-label="Close directory">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="controls">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search name, DLC, category, coords…" autocomplete="off" spellcheck="false" aria-label="Search locations">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
        <div class="control-row">
          <label class="format">
            Copy as
            <select id="format" aria-label="Coordinate copy format"></select>
          </label>
          <label class="toggle">
            <input type="checkbox" id="confirmedOnly">
            <span class="toggle-track" aria-hidden="true"></span>
            Confirmed on NoPixel
          </label>
        </div>
      </div>

      <div class="results-meta" id="resultsMeta" aria-live="polite"></div>
      <div class="list" id="list"></div>

      <footer class="source" id="source"></footer>
    </aside>

    <main class="map-wrap">
      <div id="map" aria-label="GTA V map"></div>
      <div class="cursor-coords" id="cursorCoords" aria-hidden="true"></div>
      <button class="drawer-btn" id="drawerOpen" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Directory</span>
      </button>
    </main>
  </div>

  <dialog class="modal" id="modal" aria-label="Location details"></dialog>

  <!-- "Request a location" — a Netlify Form. It must live in the HTML (not be built
       by JS) so Netlify detects it at deploy; it's submitted with fetch in app.js. -->
  <dialog class="modal request" id="requestDialog" aria-labelledby="requestTitle">
    <form name="location-request" id="requestForm" method="POST" enctype="multipart/form-data"
          data-netlify="true" netlify-honeypot="bot-field" novalidate>
      <input type="hidden" name="form-name" value="location-request">
      <p class="sr-only"><label>Leave this empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <!-- One field per screenshot (Netlify takes one file per field); filled in by app.js -->
      <input type="file" name="screenshot1" hidden><input type="file" name="screenshot2" hidden>
      <input type="file" name="screenshot3" hidden><input type="file" name="screenshot4" hidden>
      <input type="file" name="screenshot5" hidden>

      <header class="request-head">
        <div>
          <h2 id="requestTitle">Request a location</h2>
          <p>Suggest a spot for the map. It's sent to the sheet's maintainers to review.</p>
        </div>
        <button class="lb-btn" type="button" data-request="close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="request-body">
        <label class="field">
          <span>Location name <b aria-hidden="true">*</b></span>
          <input name="name" id="reqName" required maxlength="120" autocomplete="off" placeholder="e.g. Kortz Center Heist Room">
        </label>
        <label class="field">
          <span>Coordinates <b aria-hidden="true">*</b></span>
          <textarea name="coordinates" id="reqCoords" rows="2" required spellcheck="false" placeholder="x, y, z  —  e.g. 2631.41, 5893.86, -61"></textarea>
          <small>Several spots with the same interior? One per line.</small>
          <em class="field-error" id="reqCoordsError" hidden></em>
        </label>
        <div class="field-row">
          <label class="field">
            <span>Categories</span>
            <input name="category" list="reqCategories" autocomplete="off" placeholder="e.g. Garage, Warehouse">
            <small>Comma-separate several.</small>
          </label>
          <label class="field">
            <span>DLC</span>
            <input name="dlc" list="reqDlcs" autocomplete="off" placeholder="e.g. The Chop Shop">
          </label>
        </div>
        <label class="field">
          <span>Notes</span>
          <textarea name="notes" rows="3" placeholder="What's there, how to get in, anything DMs should know"></textarea>
        </label>
        <div class="field-row">
          <label class="field">
            <span>Video link</span>
            <input name="video" type="url" inputmode="url" placeholder="YouTube or Twitch">
          </label>
          <label class="field">
            <span>Image source link</span>
            <input name="image-source" type="url" inputmode="url" placeholder="Where the screenshots came from">
          </label>
        </div>
        <label class="field">
          <span>Confirmed on NoPixel?</span>
          <select name="confirmed">
            <option value="">Not sure</option>
            <option value="yes">Yes — seen working on NoPixel</option>
            <option value="no">No / doesn't seem to work</option>
          </select>
        </label>
        <div class="field">
          <span>Screenshots <small>(up to 5)</small></span>
          <label class="dropzone" id="reqDrop">
            <input type="file" id="reqImages" accept="image/*" multiple>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
            <span>Drop images here or <u>browse</u></span>
          </label>
          <ul class="thumbs" id="reqThumbs"></ul>
        </div>
        <label class="field">
          <span>Your name, Discord or email</span>
          <input name="contact" autocomplete="email" maxlength="120" placeholder="Optional — so they can follow up">
        </label>
      </div>

      <footer class="request-foot">
        <span class="request-status" id="reqStatus" role="status" aria-live="polite"></span>
        <button class="btn btn-quiet" type="button" data-request="close">Cancel</button>
        <button class="btn" type="submit" id="reqSubmit">Send request</button>
      </footer>
    </form>

    <div class="request-done" id="requestDone" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
      <h2>Request sent</h2>
      <p>Thanks! The maintainers will review it and add it to the sheet.</p>
      <div>
        <button class="btn btn-quiet" type="button" data-request="again">Request another</button>
        <button class="btn" type="button" data-request="close">Done</button>
      </div>
    </div>
  </dialog>

  <datalist id="reqCategories"></datalist>
  <datalist id="reqDlcs"></datalist>

  <dialog class="lightbox" id="lightbox" aria-label="Image viewer">
    <figure>
      <img id="lightboxImg" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="lb-btn lb-close" data-lb="close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-btn lb-prev" data-lb="prev" type="button" aria-label="Previous image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-btn lb-next" data-lb="next" type="button" aria-label="Next image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="tiles/available.js"></script>
  <script src="data/locations.js"></script>
  <script src="js/sheet-parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
